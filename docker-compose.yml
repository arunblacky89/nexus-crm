services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.prod
      - SECRET_KEY=nexuscrm-secret-key-2024
      - DB_HOST=db
      - DB_NAME=crm_db
      - DB_USER=crm_user
      - DB_PASSWORD=crm_pass
      - REDIS_URL=redis://localhost:6379/0
      - ALLOWED_HOSTS=localhost,127.0.0.1,crm.ogts.in
      - CORS_ALLOWED_ORIGINS=https://crm.ogts.in

  frontend:
    image: nginx:alpine
    expose:
      - "80"
    depends_on:
      - backend
