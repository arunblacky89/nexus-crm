services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: crm_db
      POSTGRES_USER: crm_user
      POSTGRES_PASSWORD: crm_pass
    volumes:
      - crm_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm_user -d crm_db"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.prod
      - SECRET_KEY=nexuscrm-secret-key-2024-production
      - DEBUG=True
      - DB_HOST=db
      - DB_NAME=crm_db
      - DB_USER=crm_user
      - DB_PASSWORD=crm_pass
      - REDIS_URL=redis://redis:6379/0
      - ALLOWED_HOSTS=localhost,127.0.0.1,0.0.0.0,crm.ogts.in
      - CORS_ALLOWED_ORIGINS=http://localhost:80,https://crm.ogts.in
    volumes:
      - crm_media:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A config worker -l info -c 2
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.prod
      - SECRET_KEY=nexuscrm-secret-key-2024-production
      - DB_HOST=db
      - DB_NAME=crm_db
      - DB_USER=crm_user
      - DB_PASSWORD=crm_pass
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - crm_media:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: on-failure

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: sh -c "sleep 60 && celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler"
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.prod
      - SECRET_KEY=nexuscrm-secret-key-2024-production
      - DB_HOST=db
      - DB_NAME=crm_db
      - DB_USER=crm_user
      - DB_PASSWORD=crm_pass
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: on-failure

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    expose:
      - "80"
    depends_on:
      - backend

volumes:
  crm_postgres_data:
  crm_media:
